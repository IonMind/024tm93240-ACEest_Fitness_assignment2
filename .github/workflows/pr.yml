name: Pull request checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Check Python syntax
        run: python -m py_compile app.py
      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aceest:test .
      - name: Run tests in image
        run: >-
          docker run --rm -e ACEEST_ENV=development
          --mount "type=bind,source=${{ github.workspace }}/tests,target=/app/tests,readonly"
          aceest:test python -m pytest -q -p no:cacheprovider
      - name: Smoke test production startup
        run: |
          docker run -d --name aceest-smoke -p 127.0.0.1:5000:5000 \
            -e ACEEST_SECRET_KEY=ci-test-secret \
            -e ACEEST_ADMIN_USERNAME=ci-admin \
            -e ACEEST_ADMIN_PASSWORD=ci-test-password aceest:test
          trap 'docker logs aceest-smoke; docker rm -f aceest-smoke' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 --max-time 5 http://127.0.0.1:5000/readyz